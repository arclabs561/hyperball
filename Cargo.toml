[package]
name = "hyperball"
version = "0.1.7"
edition = "2021"
rust-version = "1.75"
authors = ["Arc <attobop@gmail.com>"]
description = "Hyperbolic geometry primitives for embeddings"
license = "MIT OR Apache-2.0"
include = [
  "/src/**/*.rs",
  "/examples/**/*.rs",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/README.md",
]
repository = "https://github.com/arclabs561/hyperball"
documentation = "https://docs.rs/hyperball"
keywords = ["hyperbolic", "poincare", "lorentz", "embeddings", "geometry"]
categories = ["algorithms", "science", "mathematics"]

[workspace]

[dependencies]
skel = "0.1.1"
ndarray = { version = "0.16", optional = true }
num-traits = "0.2"
thiserror = "2.0"
# Experimental only: `rotor-experiment` compares Cl(D,1) rotors against the
# exp/log path. geomalg declares rust-version 1.85, so the feature is opt-in and
# the crate's own MSRV (1.75) is unchanged for default builds.
geomalg = { version = "0.1.1", optional = true }

[dev-dependencies]
approx = "0.5"
proptest = "1.5"
rand = "0.9"
rand_chacha = "0.9"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["ndarray"]
ndarray = ["dep:ndarray"]
# No-op: the innr dependency it enabled was removed after 0.1.6. Kept so
# dependents that enable it still build.
simd = []
# Not part of the supported API: enables `src/rotor_experiment.rs` and the
# `rotor_experiment` example. See docs/rotor-experiment.md.
rotor-experiment = ["dep:geomalg", "ndarray"]

[[bench]]
name = "hyperbolic"
harness = false

[[example]]
name = "poincare_basics"
required-features = ["ndarray"]

[[example]]
name = "tree_embedding"
required-features = ["ndarray"]

[[example]]
name = "taxonomy_embedding"
required-features = ["ndarray"]

[[example]]
name = "hierarchy_recovery"
required-features = ["ndarray"]

[[example]]
name = "distortion_vs_dimension"
required-features = ["ndarray"]

[[example]]
name = "lorentz_basics"
required-features = ["ndarray"]

[[example]]
name = "poincare_sgd"
required-features = ["ndarray"]

[[example]]
name = "lorentz_sgd"
required-features = ["ndarray"]

[[example]]
name = "graph_diagnostics"

[[example]]
name = "rotor_experiment"
required-features = ["rotor-experiment", "ndarray"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
